[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfutils"
version = "1.0.0"
description = "Servicio JSON-RPC para unir documentos PDF"
requires-python = ">=3.9"
dependencies = [
    "jsonrpcserver",
    "PyPDF2",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"